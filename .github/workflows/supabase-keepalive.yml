name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This pings the project's REST API twice a week so it never sits idle
# long enough to trigger that. The key below is the publishable/anon key
# already shipped client-side in index.html — not a secret, RLS is what
# actually protects the data, so hardcoding it here is fine.

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://jqzuoqgzqxzabvcrylmm.supabase.co/rest/v1/app_data?select=key&limit=1" \
            -H "apikey: sb_publishable_1Or2ssuRDBPP5pzZ7ZSOKw_UBUl1b9t" \
            -H "Authorization: Bearer sb_publishable_1Or2ssuRDBPP5pzZ7ZSOKw_UBUl1b9t")
          echo "Supabase REST responded with HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "Unexpected server error"
            exit 1
          fi
